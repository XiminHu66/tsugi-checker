name: Update feed & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 16:00 UTC ≈ 09:00 PDT / 08:00 PST
    - cron: "0 16 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check updates
        run: python scraper/main.py

      - name: Commit feed changes
        run: |
          git config user.name "tsugi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/feed.xml data/state.json data/site-updates.json data/acg-news.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh reading feed"
            git push
          fi

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/config _site/data
          cp index.html styles.css app.js .nojekyll _site/
          cp config/library.json config/content.json _site/config/
          cp data/feed.json data/feed.xml data/site-updates.json data/acg-news.json _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
